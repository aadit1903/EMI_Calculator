<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>EMI Calculator</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
  <div class="container">
    <div class="form-section">
      <h2>EMI Calculator</h2>
      <label>Product Type:</label>
      <select id="productType">
        <option>Phone</option>
        <option>Car</option>
        <option>Bike</option>
        <option>Laptop</option>
      </select>

      <label>Product Price:</label>
      <input type="number" id="price" placeholder="Enter product price">

      <label>Down Payment:</label>
      <input type="number" id="downPayment" placeholder="Enter down payment">

      <label>Interest Rate (Annual %):</label>
      <input type="number" id="rate" placeholder="e.g., 10">

      <label>Tenure (Months):</label>
      <input type="number" id="tenure" placeholder="e.g., 12">

      <button onclick="calculateEMI()">Calculate EMI</button>
    </div>

    <div class="result-section">
        <h3>Result</h3>
        <p id="emi">EMI Amount: ₹0</p>
        <p id="interest">Total Interest Payable: ₹0</p>
        <p id="total">Total Amount Payable: ₹0</p>
        <canvas id="pieChart" width="300" height="300"></canvas>
        <h3>Total Repayment</h3>
        <p style="text-align: center; color: gray;">
          Total Repayment = Principal Amount + Total Interest
        </p>
    </div>
      
      

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Chart.js Data Labels plugin -->
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels@2.2.0/dist/chartjs-plugin-datalabels.min.js"></script>

    <!-- Your Script -->
    <script src="script.js"></script>


</body>
</html>
